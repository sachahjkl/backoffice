<span class="trigger" [style.anchor-name]="anchorName"><ng-content /></span>
<span
  #bubble
  popover="hint"
  role="tooltip"
  [id]="id"
  [style.position-anchor]="anchorName"
  (beforetoggle)="beforeToggle($event)"
  (pointerenter)="enter($event)"
  (pointerleave)="leave()"
  >@if (content(); as template) {
  <ng-container [ngTemplateOutlet]="template" />
  } @else { {{ text() }} }</span
>
