<fieldset [disabled]="disabled()">
  <legend class="visually-hidden">{{ label() }}</legend>
  <div class="segments">
    @for (option of options(); track option.value; let index = $index) {
    <app-hint
      #hint
      [attr.data-segment-variant]="option.variant ?? variant()"
      [text]="option.hint ?? ''"
      [content]="option.hintContent"
    >
      <input
        class="visually-hidden"
        type="radio"
        [id]="controlId() + '-' + index"
        [name]="controlId()"
        [value]="option.value"
        [checked]="value() === option.value"
        [attr.aria-describedby]="option.hint || option.hintContent ? hint.id : null"
        (change)="select(option.value)"
      />
      <label [for]="controlId() + '-' + index">{{ option.label }}</label>
    </app-hint>
    }
  </div>
</fieldset>
