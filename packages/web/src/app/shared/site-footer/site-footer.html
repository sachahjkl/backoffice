<footer class="footer">
  <div class="footer-inner">
    <nav [attr.aria-label]="i18n.t('shell.legal_nav')">
      <a href="https://froment.software/legal">{{ i18n.t('nav.legal') }}</a>
      <a href="https://froment.software/privacy">{{ i18n.t('nav.privacy') }}</a>
      <a href="https://froment.software/cookies">{{ i18n.t('nav.cookies') }}</a>
      <a routerLink="/login">{{ i18n.t('backOffice.title') }}</a>
    </nav>
    @if (showPreferences()) {
    <div class="footer-controls">
      <app-language-selector [compact]="true" />
      <app-theme-toggle />
    </div>
    }
    <app-environment-status [publicPage]="false" placement="footer" />
  </div>
</footer>
