<section class="filter-select-dialog">
  @if (data.options.length > 3) {
  <div class="search-row">
    <app-icon name="search" />
    <input
      data-filter-select-search
      type="text"
      inputmode="search"
      autocomplete="off"
      [attr.aria-label]="i18n.t('listControls.searchOptions')"
      [attr.placeholder]="i18n.t('listControls.searchOptions')"
      [ngModel]="query()"
      (ngModelChange)="query.set($event)"
      (keydown)="searchKeydown($event)"
    />
  </div>
  }
  <ul
    cdkListbox
    [cdkListboxValue]="visibleSelection()"
    [cdkListboxMultiple]="data.multiple"
    (cdkListboxValueChange)="selectionChanged($event)"
  >
    @for (option of options(); track option.value) {
    <li>
      <button
        [cdkOption]="option.value"
        [cdkOptionDisabled]="option.disabled"
        type="button"
        class="option"
      >
        {{ option.label }}
      </button>
    </li>
    } @empty {
    <li class="empty">{{ i18n.t('listControls.noOptions') }}</li>
    }
  </ul>
</section>
