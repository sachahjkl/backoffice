@if (loading()) {
<p role="status">{{ loadingLabel() }}</p>
} @else if (failed()) {
<p appNotice variant="danger" role="alert">{{ errorLabel() }}</p>
} @else if (frameUrl(); as frame) { @if (openLabel(); as label) {
<div class="actions">
  <a appLinkButton [href]="url()" target="_blank" rel="noopener noreferrer">{{ label }}</a>
</div>
}
<iframe class="preview-surface" [src]="frame" [title]="title()"></iframe>
}
