@if (flash.messages().length) {
<section class="flash-stack" [attr.aria-label]="i18n.t('flash.messages')">
  @for (message of flash.messages(); track message.id) {
  <div class="flash-slot" animate.enter="flash-enter">
    <div class="flash-slot-inner">
      <article
        class="flash-message"
        tabindex="0"
        [class.dragging]="dragging(message)"
        [attr.data-variant]="message.variant"
        [style.--flash-duration]="message.timeoutMillis ? message.timeoutMillis + 'ms' : null"
        (pointerdown)="dragStart($event, message)"
        (pointermove)="dragMove($event, message)"
        (pointerup)="dragEnd($event, message)"
        (pointercancel)="dragEnd($event, message)"
        (mouseenter)="pause(message)"
        (mouseleave)="resume($event, message)"
        (focusin)="pause(message)"
        (focusout)="resume($event, message)"
      >
        <p [attr.role]="role(message)">{{ message.text }}</p>
        <button
          type="button"
          class="flash-dismiss"
          [attr.aria-label]="i18n.t('notice.dismiss')"
          (click)="flash.dismiss(message.id)"
        >
          <app-icon name="close" />
        </button>
        @if (message.timeoutMillis) {
        <span class="flash-progress" aria-hidden="true"></span>
        }
      </article>
    </div>
  </div>
  }
</section>
}
